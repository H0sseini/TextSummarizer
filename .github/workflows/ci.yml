name: Test App

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Run summary check
      run: |
        python -c "from app.main import SummarizationTool; tool = SummarizationTool(); print('✅ Ready!')"
